name: Sync generated paper indexes

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'specialist/*.md'
      - 'generalist/*.md'
      - 'studies/*.md'
      - 'data/reviews/**'
      - 'data/inclusion-policy.json'
      - 'docs/nco-publication-audit-2026-11-16.json'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync-indexes.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-paper-indexes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run review:sync
      - run: npm run indexes
      - run: npm run audit:sync
      - run: npm run validate
      - name: Open or update generated-index pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: main
          branch: automation/paper-indexes
          commit-message: 'chore: sync paper indexes'
          title: 'chore: sync paper indexes'
          body: |
            Refresh generated paper indexes, review records, and publication coverage.

            Generated by `review:sync`, `indexes`, and `audit:sync`, then checked with `npm run validate`.
            Merge through the normal review process; this workflow never pushes to main.
            If GitHub asks for approval before running the pull request checks, select **Approve workflows to run**.
          add-paths: |
            README.md
            data/relations.yml
            data/reviews/relation-dispositions.json
            data/reviews/supplement-inventory.json
            docs/FULL_TEXT_REVIEW.md
            docs/NCO_PAPER_CHECKLIST_2026-11.md
            docs/nco-publication-audit-2026-11-16.json
